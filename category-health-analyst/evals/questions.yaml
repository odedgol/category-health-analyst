# Expected numbers are fixed by the mock fixture, not generated by the scorer.
# Each case gets a fresh session. Turns within a case share conversation history.
today: '2026-09-10'
cases:
  - id: metric_discovery
    turns:
      - question: What metric names are available? List every option I can ask about.
        catalog:
          metric_ids: [image_coverage_percentage, image_count, aligned_aspects_count, misaligned_aspects_count, aligned_aspects_percentage, misaligned_aspects_percentage, has_title]
  - id: coverage_trend
    turns:
      - question: Show the daily image coverage trend for category 20081 in Germany for September 9–10, 2026.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: ['72', '64'], deltas: ['-8'], units: [percentage_points]}
  - id: two_date_comparison
    turns:
      - question: Compare image coverage for category 20081 in Germany between September 9 and September 10, 2026.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: ['72', '64'], deltas: ['-8'], units: [percentage_points]}
  - id: site_comparison
    turns:
      - question: "Compare image count for category 20081 on September 10, 2026: UK minus Germany."
        query: {intent: compare_sites, category_id: 20081, site_ids: [77, 3], metric_ids: [image_count], date_range: {start: '2026-09-10', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: [219, 229], deltas: [10], units: [count]}
  - id: period_comparison
    turns:
      - question: For category 20081 in Germany, compare the latest image coverage snapshot in September 9–10, 2026 against the latest snapshot in September 7–8, 2026. Subtract the earlier period from the later period.
        query: {intent: compare_periods, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: {start: '2026-09-07', end: '2026-09-08'}}
        result: {status: ok, values: ['80', '79', '72', '64'], deltas: ['-15'], units: [percentage_points]}
  - id: boolean_trend
    turns:
      - question: Show the daily has_title trend for category 20081 in Germany on September 6–7, 2026.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [has_title], date_range: {start: '2026-09-06', end: '2026-09-07'}, comparison_range: null}
        result: {status: ok, values: [false, true], deltas: [null], units: [boolean_transition]}
  - id: no_data
    turns:
      - question: Show the daily image count trend for category 20081 in Germany on October 1–2, 2026.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_count], date_range: {start: '2026-10-01', end: '2026-10-02'}, comparison_range: null}
        result: {status: no_data, values: [], deltas: [], units: []}
  - id: follow_up_site
    turns:
      - question: Show the daily image count trend for category 20081 in Germany on September 9–10, 2026.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_count], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: [218, 219], deltas: [1], units: [count]}
      - question: And in the UK, for the same dates and metric?
        query: {intent: trend, category_id: 20081, site_ids: [3], metric_ids: [image_count], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: [228, 229], deltas: [1], units: [count]}
  - id: relative_dates
    turns:
      - question: Show the daily image coverage trend for category 20081 in Deutschland for the last two days, including today.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: ['72', '64'], deltas: ['-8'], units: [percentage_points]}
  - id: relative_last_five_days
    turns:
      - question: Show image coverage for category 20081 in Germany for the last five days, including today.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-06', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: ['69', '80', '79', '72', '64'], deltas: ['11', '-1', '-7', '-8'], units: [percentage_points, percentage_points, percentage_points, percentage_points]}
  - id: ambiguous_category
    turns:
      - question: Show the daily image coverage trend for Armor in Germany on September 9–10, 2026.
        clarification: true
      - question: Use category ID 20081 instead, keeping the same site, metric and dates.
        query: {intent: trend, category_id: 20081, site_ids: [77], metric_ids: [image_coverage_percentage], date_range: {start: '2026-09-09', end: '2026-09-10'}, comparison_range: null}
        result: {status: ok, values: ['72', '64'], deltas: ['-8'], units: [percentage_points]}
  - id: missing_dates
    turns:
      - question: Show a daily image coverage trend for category 20081 in Germany. I have not chosen a date range yet; ask me for it.
        clarification: true
