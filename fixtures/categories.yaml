# Curated category list for mock data generation.
#
# `event`, when present, injects a sharp, deliberate step change in one
# metric, at one site (site_id defaults to 0/US), on a specific day
# (0 = first day generated, `days - 1` = most recent/"today").
# `fixtures/category_notes.yaml` references these same category_id/day
# pairs so the RAG corpus has a real event to explain — this file is the
# single source of truth both draw from.
categories:
  - category_id: 1
    name: "Women's Running Shoes"
    aliases: ["sneakers", "running sneakers", "running shoes"]
    event:
      metric_key: aligned_tax_count
      day: 80
      magnitude: -150.0

  - category_id: 2
    name: "Laptop Chargers"
    aliases: ["laptop power adapters", "charger cables"]

  - category_id: 3
