[project]
name = "category-insights-agent"
version = "0.1.0"
description = "Chatbot that answers e-commerce category-health questions via structured tool-calling and RAG, orchestrated with LangGraph behind an MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.1",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "mcp>=1.1",
    "streamlit>=1.40",
    "chromadb>=0.5",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/category_insights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "N",   # pep8-naming
]
ignore = [
    "S101", # allow assert (used in tests, and as internal invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
